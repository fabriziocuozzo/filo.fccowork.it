# Tiene attivo il progetto Supabase (piano gratuito: pausa dopo 7 giorni senza uso).
# Serve prima eseguire su Supabase lo script sql/08_keepalive.sql.
# L'indirizzo del progetto e la chiave pubblica (anon/publishable) non sono segreti: sono gli stessi che
# compaiono già nelle pagine del sito.
name: Keepalive Supabase

on:
  schedule:
    - cron: '23 6 * * *'     # ogni giorno alle 06:23 UTC
  workflow_dispatch: {}      # si può lanciare anche a mano da GitHub → Actions

permissions:
  actions: write             # serve solo per il secondo passaggio (tenere attivo il workflow)

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Chiama il database
        run: |
          curl --fail --silent --show-error --max-time 30 -X POST \
            "https://cgzjdpnhinrmklxlcgza.supabase.co/rest/v1/rpc/keepalive" \
            -H "apikey: sb_publishable_0NCeBMapmyrmC26jq1_m3g_L5a3JvEr" \
            -H "Content-Type: application/json" \
            -d '{}'
          echo
      - name: Mantieni attivo il workflow
        # GitHub disattiva i workflow programmati dopo 60 giorni senza attività nel repository:
        # riattivarlo a ogni esecuzione azzera il conteggio.
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable keepalive.yml --repo "${{ github.repository }}" || true
